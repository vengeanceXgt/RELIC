services:
  # Backend FastAPI Web Service (Free Tier)
  - type: web
    name: relic-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: uvicorn pecff.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: relic-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: relic-redis
          property: connectionString

  # Redis Key-Value Store (Free Tier)
  - type: redis
    name: relic-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

  # React Dashboard Static Site (100% Free CDN)
  - type: static
    name: relic-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # PostgreSQL Database (Free Tier)
  - name: relic-db
    databaseName: pecff
    user: pecff
    region: oregon
    plan: free
