services:
  # Backend FastAPI Service
  - type: web
    name: relic-api
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: uvicorn pecff.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: relic-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: relic-redis
          property: connectionString

  # Celery Worker
  - type: worker
    name: relic-worker
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: celery -A pecff.tasks.celery_app worker --loglevel=info -Q pecff.ingest,pecff.score,pecff.ml,pecff.report
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: relic-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: relic-redis
          property: connectionString

  # Redis Instance
  - type: redis
    name: relic-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru

  # React Dashboard (Static Site)
  - type: web
    name: relic-frontend
    runtime: static
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: relic-db
    databaseName: pecff
    user: pecff
    region: oregon
    plan: starter
