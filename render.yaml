services:
  # Backend FastAPI Web Service
  - type: web
    name: relic-api
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn pecff.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: relic-db
          property: connectionString

  # React Dashboard Static Site
  - type: web
    name: relic-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist

databases:
  - name: relic-db
    databaseName: pecff
    plan: free
